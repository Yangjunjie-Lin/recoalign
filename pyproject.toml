[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoalign"
version = "0.6.0"
description = "Structured reasoning interface validation for vision-language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yangjunjie Lin" }
]
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "tqdm>=4.65",
]

[project.optional-dependencies]
openclip = [
  "open_clip_torch==3.3.0",
]
vlm = [
  "torch>=2.4,<3",
  "transformers>=4.48,<5",
  "accelerate>=1.0,<2",
  "sentencepiece>=0.2,<1",
]
quantization = [
  "bitsandbytes>=0.45,<1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
recoalign = "recoalign.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "recoalign*",
  "datasets*",
  "models*",
  "diagnosis*",
  "synthetic_world*",
  "experiments*",
  "evaluation*",
  "training*",
  "research*",
]
exclude = ["archive*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
