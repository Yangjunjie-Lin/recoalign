    status: pending
    reason: interface checkpoint and hidden-context backend injection are not yet registered
seeds: [101, 202, 303]
final_seeds: [101, 202, 303, 404, 505]
prompt:
  protocol_id: comprehensive-reasoning-v1
  instruction: Answer the question from the image and permitted condition evidence.
generation:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 32
  num_beams: 1
statistics:
  minimum_seeds: 3
  final_seeds: 5
  confidence_level: 0.95
  paired_test: paired_bootstrap
  bootstrap_samples: 10000
capability_preservation:
  maximum_degradation: 0.02
protocol_lock:
  allow_split_override: false
  allow_prompt_override_per_model: false
  allow_decoding_override: false
  allow_test_set_tuning: false
  shared_seed_set: true
reporting:
  results_root: outputs/comprehensive
  output_root: reports/comprehensive
