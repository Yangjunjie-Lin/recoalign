reason: >-
  Primitive visual decisions are LOW while relation injection, complete evidence,
  integration surplus, and representation-format effects are all stable across five
  seeds. The registered tests therefore support more than one mechanism but do not
  identify a unique primary cause of compositional failure.
evidence:
  - A1 object shape is LOW: mean 0.500, 95% CI [0.400, 0.600].
  - A1 attribute color is LOW: mean 0.580, 95% CI [0.545, 0.620].
  - A1 direct relation is LOW: mean 0.385, 95% CI [0.375, 0.395].
  - A2 relation contribution is stable: +0.185, 95% CI [0.140, 0.225].
  - A2 complete contribution is stable: +0.415, 95% CI [0.365, 0.475].
  - A2 integration surplus is stable: +0.230, 95% CI [0.175, 0.285].
  - A3 is FORMAT_SENSITIVE; all three paired effects pass the registered gate.
